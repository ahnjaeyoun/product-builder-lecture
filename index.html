<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 저녁 뭐 먹지?</title>
    <style>
        :root {
            --bg-gradient-1: #667eea;
            --bg-gradient-2: #764ba2;
            --card-bg: #fff;
            --card-shadow: rgba(0,0,0,0.08);
            --card-hover-shadow: rgba(0,0,0,0.12);
            --text-primary: #333;
            --text-secondary: #777;
            --text-desc: #888;
            --slot-bg: #fff;
            --slot-shadow: rgba(0,0,0,0.15);
            --slot-cat-bg: #f0f0f0;
            --slot-cat-color: #666;
            --card-cat-bg: #f5f0ff;
            --card-cat-color: #764ba2;
            --filter-bg: rgba(255,255,255,0.2);
            --filter-border: rgba(255,255,255,0.3);
            --filter-hover: rgba(255,255,255,0.35);
            --filter-active-bg: #fff;
            --filter-active-color: #764ba2;
            --toggle-bg: rgba(255,255,255,0.2);
            --toggle-border: rgba(255,255,255,0.3);
        }

        [data-theme="dark"] {
            --bg-gradient-1: #1a1a2e;
            --bg-gradient-2: #16213e;
            --card-bg: #2a2a3e;
            --card-shadow: rgba(0,0,0,0.3);
            --card-hover-shadow: rgba(0,0,0,0.5);
            --text-primary: #e8e8e8;
            --text-secondary: #aaa;
            --text-desc: #999;
            --slot-bg: #2a2a3e;
            --slot-shadow: rgba(0,0,0,0.4);
            --slot-cat-bg: #3a3a50;
            --slot-cat-color: #ccc;
            --card-cat-bg: #3a2a5e;
            --card-cat-color: #c8a8ff;
            --filter-bg: rgba(255,255,255,0.08);
            --filter-border: rgba(255,255,255,0.15);
            --filter-hover: rgba(255,255,255,0.15);
            --filter-active-bg: rgba(255,255,255,0.2);
            --filter-active-color: #c8a8ff;
            --toggle-bg: rgba(255,255,255,0.1);
            --toggle-border: rgba(255,255,255,0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
            min-height: 100vh;
            color: var(--text-primary);
            transition: background 0.3s;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 0 30px;
        }

        header h1 {
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 8px;
        }

        header p {
            color: rgba(255,255,255,0.85);
            font-size: 1.1rem;
        }

        .recommend-section {
            text-align: center;
            margin-bottom: 30px;
        }

        #recommend-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #fff;
            border: none;
            padding: 18px 50px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }

        #recommend-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.5);
        }

        #recommend-btn:active {
            transform: translateY(0);
        }

        #recommend-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .slot-machine {
            margin: 25px auto;
            background: var(--slot-bg);
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            box-shadow: 0 10px 30px var(--slot-shadow);
            display: none;
        }

        .slot-machine.active {
            display: block;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .slot-display {
            font-size: 3rem;
            text-align: center;
            padding: 15px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slot-display .emoji {
            font-size: 3.5rem;
            margin-right: 10px;
        }

        .slot-display .menu-name {
            font-weight: bold;
            color: var(--text-primary);
        }

        .slot-result-desc {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-top: 5px;
        }

        .slot-result-category {
            text-align: center;
            margin-top: 10px;
        }

        .slot-result-category span {
            display: inline-block;
            background: var(--slot-cat-bg);
            color: var(--slot-cat-color);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
        }

        @keyframes slotSpin {
            0% { transform: translateY(-20px); opacity: 0; }
            50% { transform: translateY(5px); opacity: 1; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .slot-display.spinning .menu-name {
            animation: slotSpin 0.1s ease-in-out;
        }

        .category-filter {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
        }

        .category-btn {
            background: var(--filter-bg);
            color: #fff;
            border: 2px solid var(--filter-border);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .category-btn:hover {
            background: var(--filter-hover);
        }

        .category-btn.active {
            background: var(--filter-active-bg);
            color: var(--filter-active-color);
            border-color: var(--filter-active-bg);
            font-weight: bold;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 16px;
            margin-top: 20px;
            padding-bottom: 40px;
        }

        .menu-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 12px var(--card-shadow);
            transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
            cursor: default;
        }

        .menu-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px var(--card-hover-shadow);
        }

        .menu-card .card-emoji {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .menu-card .card-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .menu-card .card-desc {
            font-size: 0.9rem;
            color: var(--text-desc);
            line-height: 1.4;
        }

        .menu-card .card-category {
            display: inline-block;
            margin-top: 10px;
            background: var(--card-cat-bg);
            color: var(--card-cat-color);
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--toggle-bg);
            border: 2px solid var(--toggle-border);
            color: #fff;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            background: var(--filter-hover);
        }

        .section-title {
            color: #fff;
            font-size: 1.3rem;
            margin-bottom: 5px;
            text-align: center;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 1.8rem;
            }

            header p {
                font-size: 0.95rem;
            }

            #recommend-btn {
                padding: 15px 35px;
                font-size: 1.1rem;
            }

            .menu-grid {
                grid-template-columns: 1fr;
            }

            .slot-display {
                font-size: 2.2rem;
            }

            .slot-display .emoji {
                font-size: 2.5rem;
            }

            .category-btn {
                padding: 8px 16px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="theme-toggle" aria-label="테마 전환">🌙</button>
    <div class="container">
        <header>
            <h1>🍽️ 오늘 저녁 뭐 먹지?</h1>
            <p>결정장애 탈출! 저녁 메뉴를 추천해드립니다</p>
        </header>

        <div class="recommend-section">
            <button id="recommend-btn">🎰 오늘 뭐 먹지?</button>
            <div class="slot-machine" id="slot-machine">
                <div class="slot-display" id="slot-display">
                    <span class="emoji" id="slot-emoji"></span>
                    <span class="menu-name" id="slot-name"></span>
                </div>
                <p class="slot-result-desc" id="slot-desc"></p>
                <div class="slot-result-category" id="slot-category"></div>
            </div>
        </div>

        <div class="category-filter" id="category-filter"></div>

        <h2 class="section-title" id="menu-section-title">전체 메뉴</h2>
        <div class="menu-grid" id="menu-grid"></div>
    </div>

    <script src="main.js"></script>
</body>
</html>
