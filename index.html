<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 저녁 뭐 먹지?</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <style>
        :root {
            --bg-gradient-1: #667eea;
            --bg-gradient-2: #764ba2;
            --card-bg: #fff;
            --card-shadow: rgba(0,0,0,0.08);
            --card-hover-shadow: rgba(0,0,0,0.12);
            --text-primary: #333;
            --text-secondary: #777;
            --text-desc: #888;
            --slot-bg: #fff;
            --slot-shadow: rgba(0,0,0,0.15);
            --slot-cat-bg: #f0f0f0;
            --slot-cat-color: #666;
            --card-cat-bg: #f5f0ff;
            --card-cat-color: #764ba2;
            --filter-bg: rgba(255,255,255,0.2);
            --filter-border: rgba(255,255,255,0.3);
            --filter-hover: rgba(255,255,255,0.35);
            --filter-active-bg: #fff;
            --filter-active-color: #764ba2;
            --toggle-bg: rgba(255,255,255,0.2);
            --toggle-border: rgba(255,255,255,0.3);
        }

        [data-theme="dark"] {
            --bg-gradient-1: #1a1a2e;
            --bg-gradient-2: #16213e;
            --card-bg: #2a2a3e;
            --card-shadow: rgba(0,0,0,0.3);
            --card-hover-shadow: rgba(0,0,0,0.5);
            --text-primary: #e8e8e8;
            --text-secondary: #aaa;
            --text-desc: #999;
            --slot-bg: #2a2a3e;
            --slot-shadow: rgba(0,0,0,0.4);
            --slot-cat-bg: #3a3a50;
            --slot-cat-color: #ccc;
            --card-cat-bg: #3a2a5e;
            --card-cat-color: #c8a8ff;
            --filter-bg: rgba(255,255,255,0.08);
            --filter-border: rgba(255,255,255,0.15);
            --filter-hover: rgba(255,255,255,0.15);
            --filter-active-bg: rgba(255,255,255,0.2);
            --filter-active-color: #c8a8ff;
            --toggle-bg: rgba(255,255,255,0.1);
            --toggle-border: rgba(255,255,255,0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
            min-height: 100vh;
            color: var(--text-primary);
            transition: background 0.3s;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 0 30px;
        }

        header h1 {
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 8px;
        }

        header p {
            color: rgba(255,255,255,0.85);
            font-size: 1.1rem;
        }

        .recommend-section {
            text-align: center;
            margin-bottom: 30px;
        }

        #recommend-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #fff;
            border: none;
            padding: 18px 50px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }

        #recommend-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.5);
        }

        #recommend-btn:active {
            transform: translateY(0);
        }

        #recommend-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .slot-machine {
            margin: 25px auto;
            background: var(--slot-bg);
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            box-shadow: 0 10px 30px var(--slot-shadow);
            display: none;
        }

        .slot-machine.active {
            display: block;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .slot-display {
            font-size: 3rem;
            text-align: center;
            padding: 15px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slot-display .emoji {
            font-size: 3.5rem;
            margin-right: 10px;
        }

        .slot-display .menu-name {
            font-weight: bold;
            color: var(--text-primary);
        }

        .slot-result-desc {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-top: 5px;
        }

        .slot-result-category {
            text-align: center;
            margin-top: 10px;
        }

        .slot-result-category span {
            display: inline-block;
            background: var(--slot-cat-bg);
            color: var(--slot-cat-color);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
        }

        @keyframes slotSpin {
            0% { transform: translateY(-20px); opacity: 0; }
            50% { transform: translateY(5px); opacity: 1; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .slot-display.spinning .menu-name {
            animation: slotSpin 0.1s ease-in-out;
        }

        .category-filter {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
        }

        .category-btn {
            background: var(--filter-bg);
            color: #fff;
            border: 2px solid var(--filter-border);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .category-btn:hover {
            background: var(--filter-hover);
        }

        .category-btn.active {
            background: var(--filter-active-bg);
            color: var(--filter-active-color);
            border-color: var(--filter-active-bg);
            font-weight: bold;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 16px;
            margin-top: 20px;
            padding-bottom: 40px;
        }

        .menu-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 12px var(--card-shadow);
            transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
            cursor: default;
        }

        .menu-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px var(--card-hover-shadow);
        }

        .menu-card .card-emoji {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .menu-card .card-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .menu-card .card-desc {
            font-size: 0.9rem;
            color: var(--text-desc);
            line-height: 1.4;
        }

        .menu-card .card-category {
            display: inline-block;
            margin-top: 10px;
            background: var(--card-cat-bg);
            color: var(--card-cat-color);
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--toggle-bg);
            border: 2px solid var(--toggle-border);
            color: #fff;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            background: var(--filter-hover);
        }

        .section-title {
            color: #fff;
            font-size: 1.3rem;
            margin-bottom: 5px;
            text-align: center;
        }

        .face-banner {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 4px 12px var(--card-shadow);
            text-align: center;
            transition: background 0.3s;
        }

        .face-banner h2 {
            color: var(--text-primary);
            font-size: 1.4rem;
            margin-bottom: 15px;
        }

        .face-banner-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .webcam-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid var(--card-cat-color);
            flex-shrink: 0;
        }

        .webcam-wrapper canvas {
            width: 200px;
            height: 200px;
            object-fit: cover;
        }

        .face-result {
            text-align: left;
            min-width: 220px;
        }

        .face-result .detected-emotion {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .face-result .detected-emotion strong {
            font-size: 1.5rem;
            color: var(--text-primary);
        }

        .face-result .face-recommend {
            background: var(--card-cat-bg);
            border-radius: 14px;
            padding: 15px;
            margin-top: 10px;
        }

        .face-result .face-recommend .rec-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .face-result .face-recommend .rec-menu {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--text-primary);
        }

        .face-result .face-recommend .rec-desc {
            font-size: 0.85rem;
            color: var(--text-desc);
            margin-top: 4px;
        }

        #face-start-btn,
        #face-capture-btn,
        #face-retry-btn {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: #333;
            border: none;
            padding: 14px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(67, 233, 123, 0.3);
        }

        #face-start-btn:hover,
        #face-capture-btn:hover,
        #face-retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(67, 233, 123, 0.4);
        }

        #face-start-btn:disabled,
        #face-capture-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #face-capture-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #fff;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.3);
        }

        #face-capture-btn:hover {
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
        }

        .face-bars {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 12px;
            width: 100%;
            max-width: 300px;
        }

        .face-bar-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .face-bar-row .bar-label {
            width: 80px;
            text-align: right;
            flex-shrink: 0;
        }

        .face-bar-row .bar-track {
            flex: 1;
            height: 8px;
            background: var(--slot-cat-bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .face-bar-row .bar-fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.2s;
        }

        @media (max-width: 600px) {
            .face-banner-content {
                flex-direction: column;
            }

            .webcam-wrapper {
                width: 160px;
                height: 160px;
            }

            .webcam-wrapper canvas {
                width: 160px;
                height: 160px;
            }

            .face-result {
                text-align: center;
                min-width: unset;
            }

            .face-bars {
                margin: 12px auto 0;
            }
        }

        .disqus-section {
            max-width: 800px;
            margin: 20px auto;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 12px var(--card-shadow);
            transition: background 0.3s;
        }

        .disqus-section h2 {
            text-align: center;
            color: var(--text-primary);
            margin-bottom: 20px;
            font-size: 1.4rem;
        }

        .contact-section {
            max-width: 500px;
            margin: 20px auto 40px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 12px var(--card-shadow);
            transition: background 0.3s;
        }

        .contact-section h2 {
            text-align: center;
            color: var(--text-primary);
            margin-bottom: 20px;
            font-size: 1.4rem;
        }

        .contact-section .form-group {
            margin-bottom: 14px;
        }

        .contact-section label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .contact-section input,
        .contact-section textarea {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid var(--filter-border);
            border-radius: 10px;
            background: var(--slot-bg);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .contact-section input:focus,
        .contact-section textarea:focus {
            outline: none;
            border-color: var(--card-cat-color);
        }

        .contact-section textarea {
            resize: vertical;
            min-height: 90px;
        }

        .contact-section button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 6px;
        }

        .contact-section button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 1.8rem;
            }

            header p {
                font-size: 0.95rem;
            }

            #recommend-btn {
                padding: 15px 35px;
                font-size: 1.1rem;
            }

            .menu-grid {
                grid-template-columns: 1fr;
            }

            .slot-display {
                font-size: 2.2rem;
            }

            .slot-display .emoji {
                font-size: 2.5rem;
            }

            .category-btn {
                padding: 8px 16px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="theme-toggle" aria-label="테마 전환">🌙</button>
    <div class="container">
        <header>
            <h1>🍽️ 오늘 저녁 뭐 먹지?</h1>
            <p>결정장애 탈출! 저녁 메뉴를 추천해드립니다</p>
        </header>

        <div class="recommend-section">
            <button id="recommend-btn">🎰 오늘 뭐 먹지?</button>
            <div class="slot-machine" id="slot-machine">
                <div class="slot-display" id="slot-display">
                    <span class="emoji" id="slot-emoji"></span>
                    <span class="menu-name" id="slot-name"></span>
                </div>
                <p class="slot-result-desc" id="slot-desc"></p>
                <div class="slot-result-category" id="slot-category"></div>
            </div>
        </div>

        <div class="category-filter" id="category-filter"></div>

        <div class="face-banner" id="face-banner">
            <h2>📸 표정으로 메뉴 추천받기</h2>
            <p style="color:var(--text-secondary); margin-bottom:15px; font-size:0.95rem;">카메라로 표정을 찍으면 딱 맞는 메뉴를 추천해드려요!</p>
            <div id="face-before-start">
                <button id="face-start-btn">📷 카메라 시작하기</button>
            </div>
            <div id="face-webcam-phase" style="display:none;">
                <div class="webcam-wrapper" style="margin:0 auto 15px;">
                    <div id="webcam-container"></div>
                </div>
                <button id="face-capture-btn">📸 촬영하기</button>
            </div>
            <div id="face-result-phase" style="display:none;">
                <div class="face-banner-content">
                    <div class="webcam-wrapper">
                        <canvas id="face-snapshot" width="200" height="200"></canvas>
                    </div>
                    <div class="face-result">
                        <div class="detected-emotion" id="detected-emotion"></div>
                        <div class="face-bars" id="face-bars"></div>
                        <div class="face-recommend" id="face-recommend">
                            <div class="rec-label">당신에게 추천하는 메뉴</div>
                            <div class="rec-menu" id="face-rec-menu"></div>
                            <div class="rec-desc" id="face-rec-desc"></div>
                        </div>
                    </div>
                </div>
                <button id="face-retry-btn" style="margin-top:18px;">🔄 다시 찍기</button>
            </div>
        </div>

        <h2 class="section-title" id="menu-section-title">전체 메뉴</h2>
        <div class="menu-grid" id="menu-grid"></div>

        <div class="disqus-section">
            <h2>💬 댓글</h2>
            <div id="disqus_thread"></div>
            <script>
                (function() {
                var d = document, s = d.createElement('script');
                s.src = 'https://https-product-builder-lecture-2g1-pages-dev.disqus.com/embed.js';
                s.setAttribute('data-timestamp', +new Date());
                (d.head || d.body).appendChild(s);
                })();
            </script>
            <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
        </div>

        <div class="contact-section">
            <h2>📩 제휴 문의</h2>
            <form action="https://formspree.io/f/xlgwdjbg" method="POST">
                <div class="form-group">
                    <label for="name">이름</label>
                    <input type="text" id="name" name="name" placeholder="이름을 입력하세요" required>
                </div>
                <div class="form-group">
                    <label for="email">이메일</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>
                </div>
                <div class="form-group">
                    <label for="company">회사/단체명 (선택)</label>
                    <input type="text" id="company" name="company" placeholder="회사 또는 단체명">
                </div>
                <div class="form-group">
                    <label for="message">문의 내용</label>
                    <textarea id="message" name="message" placeholder="문의 내용을 입력하세요" required></textarea>
                </div>
                <button type="submit">문의 보내기</button>
            </form>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
